name: libos-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install assembly validation tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Host Rust regression tests
        run: |
          cargo test --locked --lib --tests
          cargo test --locked --features format --lib --tests
      - name: Python reference and tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Startup, IRQ ABI, memory ABI and linker checks
        run: python3 tools/check_runtime.py
      - name: Compile and audit all Rust firmware
        run: python3 tools/build.py --all
      - name: Execute selected Rust firmware in reference model
        run: python3 tools/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-and-verification
          path: dist/
          if-no-files-found: ignore
