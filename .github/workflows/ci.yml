name: libos-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the fixed Rust toolchain
        run: rustup show
      - name: Fetch the fixed official simulator
        run: cargo xtask fetch-upstream
      - name: Run the Rust release gates
        run: cargo xtask verify
      - name: Package the verified commit
        run: cargo xtask package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-and-verification
          path: dist/preview2/
          if-no-files-found: error
