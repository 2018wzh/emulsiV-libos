[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "=1.0.95"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
zip = { version = "=0.6.6", default-features = false }
boa_engine = { version = "=0.20.0", default-features = false }
# Keep transitive dependencies compatible with the fixed Rust toolchain.
time = "=0.3.37"
regress = "=0.10.3"
