[package]
name = "emulsiv-libos"
version = "0.1.0-preview.2"
edition = "2021"
rust-version = "1.85"
description = "A no_std Rust library OS for emulsiV with optional reclaiming heap support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/2018wzh/emulsiV-libos"
keywords = ["riscv", "bare-metal", "no-std", "emulsiv", "allocator"]
categories = ["embedded", "no-std", "memory-management"]
build = "build.rs"
include = ["src/**", "examples/**", "tests/**", "build.rs", "link.x", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md", "docs/HEAP.md", "docs/ARCHITECTURE.md", "docs/PORTING.md", "docs/VERIFICATION.md", "docs/WRITING.md", "docs/RELEASE.md", "CONTRIBUTING.md"]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"

[features]
default = ["runtime"]
runtime = []
format = []
heap = ["runtime"]

[profile.dev]
panic = "abort"
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = true
strip = false

[lib]
path = "src/lib.rs"

[[example]]
name = "heap_box"
required-features = ["heap"]

[[example]]
name = "heap_vec"
required-features = ["heap"]

[[example]]
name = "heap_string"
required-features = ["heap"]

[[example]]
name = "heap_reuse"
required-features = ["heap"]

[[example]]
name = "heap_oom"
required-features = ["heap"]
